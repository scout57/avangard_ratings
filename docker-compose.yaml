services:
  project:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JYPUTER_PORT: ${JYPUTER_PORT}
    image: avangard_ratings:latest
    init: true
    restart: "no"
    env_file:
      - .env
    volumes:
      - ./project:/project
    working_dir: /project
    ports:
      - ${JYPUTER_PORT}:${JYPUTER_PORT}
    command: ["bash", "/project/jupyter.sh"]

